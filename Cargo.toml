[package]
name = "sider"
version = "1.1.0"
edition = "2024"
description = "In-memory database server with an incremental Redis-compatible core"
repository = "https://github.com/djairofilho/sider"
license = "MIT"
publish = false
default-run = "sider"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
rcgen = "0.13"
proptest = "1"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dev-dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
