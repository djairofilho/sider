[package]
name = "sider"
version = "0.1.0"
edition = "2024"
description = "In-memory database server with an incremental Redis-compatible core"
repository = "https://github.com/djairofilho/sider"
license = "MIT"
publish = false
default-run = "sider"

[dependencies]
bytes = "1"
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
