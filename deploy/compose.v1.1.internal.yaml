# Apply with compose.v1.1.yaml only after mounting a complete restricted
# client and internal TLS generation for each selected profile.
services:
  memory:
    environment:
      SIDER_REPLICATION_ADDR: 0.0.0.0:6380
    ports:
      - "127.0.0.1:${SIDER_MEMORY_INTERNAL_PORT:-6381}:6380"

  composed:
    environment:
      SIDER_REPLICATION_ADDR: 0.0.0.0:6380
    ports:
      - "127.0.0.1:${SIDER_COMPOSED_INTERNAL_PORT:-6382}:6380"
