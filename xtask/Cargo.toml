[package]
name = "sider-xtask"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Local development and release checks for Sider"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# Tooling stays outside the product dependency graph.
[workspace]
members = ["."]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
