[package]
name = "sider-lua-containment-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"] }

[target.'cfg(windows)'.dependencies]
processkit = { version = "=3.3.4", default-features = false, features = ["process-control", "limits", "stats"] }
tokio = { version = "=1.53.2", features = ["process", "io-util", "rt", "time"] }
