# Inactive reference. Restore and review only after Sider 1.0.
# Until then, merging a release PR does not publish a release automatically.
name: Private release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, closed]

permissions:
  contents: read
  issues: read

# Queue all release runs. A third merge must not replace a pending publication.
concurrency:
  group: sider-release-publication
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
      contains(github.event.pull_request.labels.*.name, 'type:release') &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.context.outputs.version }}
      sha: ${{ steps.context.outputs.sha }}
      published: ${{ steps.context.outputs.published }}
      merged: ${{ steps.context.outputs.merged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate plan and automation
        run: |
          python -m tools.release.cli validate
          python -m unittest discover -s tools/release -t . -p "test_*.py"
      - name: Check exact source, backlog, notes and candidate
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release.cli preflight

  packages:
    needs: preflight
    if: needs.preflight.outputs.merged == 'true' && needs.preflight.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: rustup show
      - name: Native CI, packaging and extracted TCP smoke test
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: python -m tools.release.cli package $env:RELEASE_VERSION --target $env:RELEASE_TARGET --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  product:
    needs: preflight
    if: needs.preflight.outputs.merged == 'true' && needs.preflight.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: rustup show
      - name: Execute cumulative gates (missing implementations fail closed)
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: python -m tools.release.cli gates $env:RELEASE_VERSION --target $env:RELEASE_TARGET --out evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.target }}
          path: |
            evidence/product-gates-*.json
            evidence/sider-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, packages, product]
    if: >-
      always() && !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.merged == 'true' &&
      ((needs.preflight.outputs.published == 'true' &&
        needs.packages.result == 'skipped' && needs.product.result == 'skipped') ||
       (needs.preflight.outputs.published == 'false' &&
        needs.packages.result == 'success' && needs.product.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.preflight.outputs.published == 'false'
        with:
          path: dist
          merge-multiple: true
      - name: Verify, publish or reconcile the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release.cli publish --out dist --apply
