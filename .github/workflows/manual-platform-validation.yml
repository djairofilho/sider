name: Manual platform validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-check:
    name: Native check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the dispatched SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record runner identity and capabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($checkoutSha -ne $env:GITHUB_SHA) {
            throw "Checkout SHA $checkoutSha differs from dispatch SHA $env:GITHUB_SHA"
          }
          $facts = [ordered]@{
            source_sha = $checkoutSha
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            os = $env:RUNNER_OS
            architecture = $env:RUNNER_ARCH
            rustc = (rustc --version)
            cargo = (cargo --version)
          }
          if ($IsWindows) {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $facts.windows_version = (Get-CimInstance Win32_OperatingSystem).Version
            $facts.identity_sid = $identity.User.Value
            $facts.administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            $driveRoot = $env:SystemDrive + '\'
            $driveAcl = Get-Acl -LiteralPath $driveRoot
            $facts.drive_root_owner = $driveAcl.Owner
            $facts.drive_root_aces = @($driveAcl.Access | ForEach-Object {
              [ordered]@{
                identity = $_.IdentityReference.Value
                rights = $_.FileSystemRights.ToString()
                type = $_.AccessControlType.ToString()
                propagation = $_.PropagationFlags.ToString()
              }
            })
            $privateProbe = Join-Path $driveRoot ("sider-owner-probe-" + [guid]::NewGuid())
            try {
              New-Item -ItemType Directory -Path $privateProbe | Out-Null
              $grant = '*' + $identity.User.Value + ':(OI)(CI)F'
              & icacls.exe $privateProbe '/grant:r' $grant | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'private grant failed' }
              & icacls.exe $privateProbe '/inheritance:r' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'inheritance removal failed' }
              $facts.private_directory_owner = (Get-Acl -LiteralPath $privateProbe).Owner
              $privateFile = Join-Path $privateProbe 'material.txt'
              Set-Content -LiteralPath $privateFile -Value 'sider probe'
              $facts.private_file_owner = (Get-Acl -LiteralPath $privateFile).Owner
            } catch {
              $facts.private_acl_probe_error = $_.Exception.Message
            }
            $probe = Join-Path $env:RUNNER_TEMP ("sider-symlink-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $probe | Out-Null
            $target = Join-Path $probe 'target.txt'
            Set-Content -LiteralPath $target -Value 'sider probe'
            try {
              New-Item -ItemType SymbolicLink -Path (Join-Path $probe 'link.txt') -Target $target -ErrorAction Stop | Out-Null
              $facts.file_symlink = 'created'
            } catch {
              $facts.file_symlink = "failed: $($_.Exception.Message)"
            }
          } else {
            $facts.uname = (uname -a)
            $facts.os_release = @(Get-Content /etc/os-release)
            $facts.temp_mount = (findmnt --target $env:RUNNER_TEMP --output SOURCE,FSTYPE,OPTIONS --noheadings)
            $facts.wsl_kernel = ((uname -r) -match 'microsoft')
          }
          $facts | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 runner-context.json
          Get-Content runner-context.json

      - name: Run the repository's native check
        shell: pwsh
        run: |
          cargo xtask check 2>&1 | Tee-Object -FilePath native-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain context and check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-check-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runner-context.json
            native-check.log
          if-no-files-found: error
          retention-days: 14
